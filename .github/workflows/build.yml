name: Daily Build

permissions: write-all

on:
  push:
    branches: [ "master", "debian-13" ]
  pull_request:
    branches: [ "master", "debian-13" ]
  schedule:
    - cron: "59 18 * * *"
  workflow_dispatch:

jobs:
  debian:
    name: Build amd64 ISO (Debian 13 Trixie)
    runs-on: ubuntu-22.04

    # 🔥 Run entire job inside Debian 13 container
    container:
      image: debian:trixie
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      # ================================
      # INSTALL BUILD DEPENDENCIES
      # ================================
      - name: Install dependencies
        run: |
          apt update
          apt install -y \
            git sudo fakeroot live-build debootstrap \
            debian-cd simple-cdd xorriso squashfs-tools \
            mtools curl jq ca-certificates

      # ================================
      # SHOW DISK SPACE
      # ================================
      - name: Show disk space
        run: df -h

      # ================================
      # BUILD ISO
      # ================================
      - name: Build ISO
        run: |
          export LINGMO_ARCH=amd64
          export DEBIAN_FRONTEND=noninteractive
          bash ./build.sh

      # ================================
      # VERIFY ISO EXISTS
      # ================================
      - name: List ISO output
        run: |
          ls -lah images || true
          find . -name "*.iso"

      # ================================
      # UPLOAD ISO
      # ================================
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd64-iso
          path: |
            images/*.iso
            *.iso
          compression-level: 0
          if-no-files-found: error
