name: Daily Build

permissions: write-all

on:
  push:
    branches: [ "master", "debian-13" ]
  pull_request:
    branches: [ "master", "debian-13" ]
  schedule:
    - cron: "59 18 * * *"
  workflow_dispatch:

jobs:
  debian:
    name: Build amd64 ISO (Debian 13 Trixie)
    runs-on: ubuntu-22.04

    container:
      image: debian:trixie
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      # ================================
      # INSTALL DEPENDENCIES
      # ================================
      - name: Install build dependencies
        run: |
          apt update
          apt install -y \
            live-build debootstrap simple-cdd \
            debian-cd xorriso squashfs-tools \
            mtools fakeroot git curl jq sudo \
            ca-certificates

      # ================================
      # PATCH auto/config (REMOVE IP API DEPENDENCY)
      # ================================
      - name: Patch auto/config to use static Debian mirror
        run: |
          echo "Patching auto/config..."

          awk '
          BEGIN { skip=0 }
          /# 使用ipapi查询IP地址信息/ {
              skip=1;
              print "lingmo_mirror=http://ftp.debian.org/debian";
              print "public_lingmo_mirror=http://ftp.debian.org/debian";
              next
          }
          /### DO NOT EDIT THE REST OF THIS FILE ###/ {
              skip=0
          }
          skip==0 { print }
          ' auto/config > auto/config.tmp && mv auto/config.tmp auto/config

          echo "Patch complete."

      # ================================
      # SHOW DISK
      # ================================
      - name: Show disk space
        run: df -h

      # ================================
      # BUILD ISO
      # ================================
      - name: Build ISO
        run: |
          export LINGMO_ARCH=amd64
          export DEBIAN_FRONTEND=noninteractive
          bash ./build.sh

      # ================================
      # VERIFY OUTPUT
      # ================================
      - name: List ISO files
        run: |
          find . -name "*.iso"

      # ================================
      # UPLOAD ISO
      # ================================
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd64-iso
          path: |
            images/*.iso
            *.iso
          compression-level: 0
          if-no-files-found: error
