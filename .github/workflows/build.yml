name: Daily Build

permissions: write-all

on:
  push:
    branches: [ "master", "debian-12" ]
  pull_request:
    branches: [ "master", "debian-12" ]
  schedule:
    - cron: "59 18 * * *"
  workflow_dispatch:

jobs:
  debian:
    name: Build amd64 iso
    runs-on: ubuntu-22.04
    permissions: write-all

    steps:
      # ================================
      # MAXIMIZE DISK SPACE
      # ================================
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 4096
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Aggressive cleanup
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache
          sudo docker system prune -af || true
          df -h

      - uses: actions/checkout@v4

      # ================================
      # INSTALL BUILD DEPENDENCIES
      # ================================
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git fakeroot live-build debootstrap \
            debian-cd simple-cdd xorriso squashfs-tools \
            mtools curl jq

      # ================================
      # BUILD ISO
      # ================================
      - name: Build ISO
        run: |
          cd $GITHUB_WORKSPACE
          export LINGMO_ARCH=amd64
          export DEBIAN_FRONTEND=noninteractive
          sudo bash ./build.sh

      # ================================
      # UPLOAD ISO
      # ================================
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd64-iso
          path: images/*.iso
          compression-level: 0
          if-no-files-found: error
